<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 8px; max-width: 500px; margin: 0 auto; text-align: center; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333333; }
        .code-box { background-color: #f8f9fa; border: 2px dashed #007bff; padding: 15px; font-size: 32px; font-weight: bold; color: #007bff; letter-spacing: 5px; margin: 20px 0; border-radius: 5px; }
        p { color: #555555; line-height: 1.5; }
        .footer { margin-top: 30px; font-size: 12px; color: #999999; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Password Reset Request</h2>
        <p>We received a request to reset the password for your account. Enter the following 6-digit code in the app to continue:</p>
        
        <div class="code-box">
            {{ code }}
        </div>
        
        <p>If you did not request this reset, please ignore this email.</p>
        
        <div class="footer">
            &copy; 2026 ManoVox. All rights reserved.
        </div>
    </div>
</body>
</html>
